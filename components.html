<!doctype html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Components | Harno UI</title>
    <link rel="stylesheet" href="eelibs/import.css">

    <style>
        #container {
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
        }

        .specialPage {
            min-width: 100dvw;
            min-height: 100dvh;
            max-width: 100dvw;
            max-height: 100dvh;
            overflow: scroll;
            position: absolute;
            top: 0;
            left: 0;

            &:not(.active) {
                pointer-events: none;

                &#welcome {
                    top: -200dvh;
                    opacity: 0;
                    border-bottom-left-radius: var(--br);
                    border-bottom-right-radius: var(--br);
                }

                &#components {
                    opacity: 0;
                }
            }

            .pageContent {
                min-width: max-content;
                min-height: max-content;
            }
        }

        #welcome .pageContent {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: var(--bg-base);
            background: #020024;
            background: linear-gradient(132deg, rgb(1, 0, 18) 0%, rgb(4, 4, 61) 35%, rgb(21, 58, 66) 100%);
            transition: top 1.3s ease, opacity 0.7s ease, border 0.3s ease;
            z-index: 100;

            h1,
            h2,
            h3 {
                margin: 0;
                margin-bottom: var(--ds);
            }

            h1 {
                font-weight: 800;
            }

            h2,
            h3 {
                color: var(--text-sec);
            }

            #startBtn {
                margin-top: var(--ds2);
                min-width: 150px;
            }
        }

        #components .pageContent {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 16px;

            margin: var(--ds);

            transition: opacity 0.3s ease;
        }

        .componentCard {
            background-color: var(--c-gray-700);
            border-radius: var(--br);
            padding: var(--ds);
            min-width: 400px;

            .componentName {
                margin: 0;
                margin-bottom: var(--ds);
            }
        }

        .componentVariations {
            background-color: var(--c-gray-900);
            border-radius: var(--br);
            padding: var(--ds);

            display: flex;
            flex-direction: column;
            gap: var(--ds);
        }
    </style>
</head>

<script>
    function changeSpecialPage(id) {
        document.querySelectorAll('.specialPage').forEach(page => {
            page.classList.remove('active')
        })

        const target = document.getElementById(id)
        if (target) target.classList.add('active')
        target.classList.add('active')
    }

    document.addEventListener('DOMContentLoaded', () => {
        changeSpecialPage('welcome')
        changeSpecialPage('components')
    })
</script>
